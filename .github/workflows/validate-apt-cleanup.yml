# Temporary fork-only validation. Keep this file out of the upstream PR.
# Publish together with the five candidate files on this exact temporary branch.
name: Validate apt cleanup with cache options

on:
  push:
    branches: [codex/validate-ansible-83747]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'pentaoa/ansible'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e53751fb29987c897a636eff5bcf796f30f7a125
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare disposable Linux runner
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" || git fetch --no-tags --depth=1 https://github.com/ansible/ansible.git "$BASE_SHA"
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y python3-apt
          /usr/bin/python3 -c 'import apt, apt_pkg; print("System apt bindings available")'
          mkdir -p "$RUNNER_TEMP/apt-validation"
      - name: Reproduce against real apt in check mode before and after
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          source = Path('lib/ansible/modules/apt.py')
          fixed = source.read_bytes()
          original = subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + source.as_posix()])
          out_dir = Path(os.environ['RUNNER_TEMP']) / 'apt-validation'
          environment = dict(os.environ, PYTHONPATH=str(Path('lib').resolve()))
          try:
              for version, contents in [('baseline', original), ('fixed', fixed)]:
                  source.write_bytes(contents)
                  for with_cache in [False, True]:
                      arguments = dict(autoremove=True, _ansible_check_mode=True, auto_install_module_deps=False)
                      if with_cache:
                          arguments.update(update_cache=True, cache_valid_time=3600)
                      result = subprocess.run(
                          ['/usr/bin/python3', '-m', 'ansible.modules.apt', json.dumps({'ANSIBLE_MODULE_ARGS': arguments})],
                          env=environment, capture_output=True, text=True, check=True,
                      )
                      name = f'{version}-cache-{with_cache}'
                      (out_dir / f'{name}.json').write_text(result.stdout)
                      print(name, result.stdout, result.stderr, flush=True)
                      response = json.loads(result.stdout)
                      assert not response.get('failed'), response
                      expect_cleanup = version == 'fixed' or not with_cache
                      assert ('stdout' in response) is expect_cleanup, response
                      if not expect_cleanup:
                          assert 'cache_updated' in response, response
          finally:
              source.write_bytes(fixed)
          assert source.read_bytes() == fixed
          PY
      - name: Regression tests fail on the baseline and pass with the fix
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = Path('lib/ansible/modules/apt.py')
          fixed = source.read_bytes()
          original = subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + source.as_posix()])
          out_dir = Path(os.environ['RUNNER_TEMP']) / 'apt-validation'
          command = [sys.executable, 'bin/ansible-test', 'units', '--venv', '--python', '3.13',
                     '--requirements', '--num-workers', '2', '-v', 'test/units/modules/test_apt.py']
          try:
              for version, contents, expected_failures in [('baseline', original, 12), ('fixed', fixed, 0)]:
                  source.write_bytes(contents)
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  print(result.stdout, flush=True)
                  (out_dir / f'{version}-units.log').write_text(result.stdout)
                  reports = list(Path('test/results/junit').glob('*units.xml'))
                  assert len(reports) == 1, reports
                  shutil.copyfile(reports[0], out_dir / f'{version}-units.xml')
                  root = ET.parse(reports[0]).getroot()
                  cases = root.findall('.//testcase')
                  failures = [case for case in cases if case.find('failure') is not None]
                  errors = [case for case in cases if case.find('error') is not None]
                  skipped = [case for case in cases if case.find('skipped') is not None]
                  assert len(cases) == 22 and not errors and not skipped, (len(cases), errors, skipped)
                  assert len(failures) == expected_failures, [(case.attrib, case.find('failure').text) for case in failures]
                  assert all(case.attrib['name'].startswith('test_cleanup_with_cache_options') for case in failures)
                  assert (result.returncode == 0) is (expected_failures == 0), result.returncode
          finally:
              source.write_bytes(fixed)
          assert source.read_bytes() == fixed
          PY
      - name: Sanity checks for every candidate file
        shell: bash
        run: |
          set -euo pipefail
          python bin/ansible-test sanity --venv --python 3.13 --requirements --junit -v \
            lib/ansible/modules/apt.py \
            test/units/modules/test_apt.py \
            test/integration/targets/apt/tasks/main.yml \
            test/integration/targets/apt/tasks/apt_autoremove_cache.yml \
            changelogs/fragments/83747-apt-cleanup-cache.yml \
            2>&1 | tee "$RUNNER_TEMP/apt-validation/sanity.log"
      - name: Run the targeted upstream integration tasks on the ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          playbook = [{
              'name': 'Validate apt cache and autoremove behavior',
              'hosts': 'localhost',
              'gather_facts': False,
              'become': True,
              'tasks': [{'ansible.builtin.include_tasks': str(Path('test/integration/targets/apt/tasks/apt_autoremove_cache.yml').resolve())}],
          }]
          output = Path(os.environ['RUNNER_TEMP']) / 'apt-validation' / 'integration.yml'
          output.write_text(yaml.safe_dump(playbook))
          PY
          ansible-playbook -i localhost, -c local \
            -e ansible_python_interpreter=/usr/bin/python3 \
            "$RUNNER_TEMP/apt-validation/integration.yml" \
            2>&1 | tee "$RUNNER_TEMP/apt-validation/integration.log"
      - name: Verify candidate source restored
        if: always()
        run: git diff --exit-code -- lib/ansible/modules/apt.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-83747-validation
          path: |
            ${{ runner.temp }}/apt-validation
            test/results/junit
          retention-days: 7
